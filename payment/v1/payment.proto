syntax = "proto3";

package payment;

import "google/protobuf/timestamp.proto";

// =========================
// Enums
// =========================

enum CurrencyCode {
  CURRENCY_CODE_UNSPECIFIED = 0;
  CURRENCY_CODE_NGN = 1;
  CURRENCY_CODE_USD = 2;
}

enum WalletStatus {
  WALLET_STATUS_UNSPECIFIED = 0;
  WALLET_STATUS_ACTIVE = 1;
  WALLET_STATUS_FROZEN = 2;
  WALLET_STATUS_CLOSED = 3;
}

enum EscrowStatus {
  ESCROW_STATUS_UNSPECIFIED = 0;
  ESCROW_STATUS_HELD = 1;
  ESCROW_STATUS_IN_PROGRESS = 2;
  ESCROW_STATUS_PENDING_BUYER_RELEASE = 3;
  ESCROW_STATUS_RELEASED = 4;
  ESCROW_STATUS_REFUNDED = 5;
  ESCROW_STATUS_DISPUTED = 6;
  ESCROW_STATUS_CANCELLED = 7;
}

enum DisputeStatus {
  DISPUTE_STATUS_UNSPECIFIED = 0;
  DISPUTE_STATUS_OPEN = 1;
  DISPUTE_STATUS_UNDER_REVIEW = 2;
  DISPUTE_STATUS_RESOLVED_BUYER = 3;
  DISPUTE_STATUS_RESOLVED_AGENT = 4;
  DISPUTE_STATUS_SPLIT = 5;
  DISPUTE_STATUS_REJECTED = 6;
}

enum WithdrawalStatus {
  WITHDRAWAL_STATUS_UNSPECIFIED = 0;
  WITHDRAWAL_STATUS_PENDING = 1;
  WITHDRAWAL_STATUS_PROCESSING = 2;
  WITHDRAWAL_STATUS_SUCCESS = 3;
  WITHDRAWAL_STATUS_FAILED = 4;
  WITHDRAWAL_STATUS_CANCELLED = 5;
}

enum ActorRole {
  ACTOR_ROLE_UNSPECIFIED = 0;
  ACTOR_ROLE_BUYER = 1;
  ACTOR_ROLE_AGENT = 2;
  ACTOR_ROLE_ADMIN = 3;
  ACTOR_ROLE_SYSTEM = 4;
}

enum PaymentPurpose {
  PAYMENT_PURPOSE_UNSPECIFIED = 0;
  PAYMENT_PURPOSE_ESCROW_FUNDING = 1;
  PAYMENT_PURPOSE_WALLET_TOPUP = 2;
}

enum EscrowEventType {
  ESCROW_EVENT_TYPE_UNSPECIFIED = 0;
  ESCROW_EVENT_TYPE_CREATED = 1;
  ESCROW_EVENT_TYPE_FUNDS_HELD = 2;
  ESCROW_EVENT_TYPE_MARKED_COMPLETE = 3;
  ESCROW_EVENT_TYPE_RELEASED = 4;
  ESCROW_EVENT_TYPE_DISPUTE_OPENED = 5;
  ESCROW_EVENT_TYPE_DISPUTE_RESOLVED = 6;
  ESCROW_EVENT_TYPE_REFUNDED = 7;
  ESCROW_EVENT_TYPE_CANCELLED = 8;
}

// =========================
// Shared messages
// =========================

message PaginationRequest {
  int32 page = 1;
  int32 limit = 2;
}

message PaginationMeta {
  int32 page = 1;
  int32 limit = 2;
  int32 total = 3;
  int32 total_pages = 4;
}

message Currency {
  CurrencyCode code = 1;
  string name = 2;
  string symbol = 3;
}

// =========================
// Wallet domain
// =========================

message Wallet {
  string wallet_id = 1;
  string user_id = 2;
  WalletStatus status = 3;
  Currency currency = 4;

  // money in minor units (kobo/cents)
  int64 total_balance_minor = 5;
  int64 available_balance_minor = 6;
  int64 held_balance_minor = 7;

  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message WalletTransaction {
  string transaction_id = 1;
  string wallet_id = 2;
  string user_id = 3;

  // credit/debit in minor unit
  int64 amount_minor = 4;
  string direction = 5; // "credit" | "debit"
  string entry_type = 6; // "topup" | "escrow_hold" | "escrow_release" | "refund" | "withdrawal"

  string reference_type = 7; // "escrow" | "payment" | "withdrawal" | "manual_adjustment"
  string reference_id = 8;
  string note = 9;

  google.protobuf.Timestamp created_at = 10;
}

message Withdrawal {
  string withdrawal_id = 1;
  string wallet_id = 2;
  string user_id = 3;
  int64 amount_minor = 4;
  Currency currency = 5;
  WithdrawalStatus status = 6;

  string bank_code = 7;
  string account_number_last4 = 8;
  string account_name = 9;
  string provider_reference = 10;
  string failure_reason = 11;

  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

message CreateWalletRequest {
  string user_id = 1;
  CurrencyCode currency_code = 2;
}

message CreateWalletResponse {
  bool success = 1;
  string message = 2;
  Wallet wallet = 3;
}

message GetWalletByUserIdRequest {
  string user_id = 1;
}

message GetWalletByIdRequest {
  string wallet_id = 1;
}

message GetWalletResponse {
  bool success = 1;
  string message = 2;
  Wallet wallet = 3;
}

message CreditWalletRequest {
  string user_id = 1;
  int64 amount_minor = 2;
  string reference_type = 3;
  string reference_id = 4;
  string note = 5;
  string idempotency_key = 6;
}

message DebitWalletRequest {
  string user_id = 1;
  int64 amount_minor = 2;
  string reference_type = 3;
  string reference_id = 4;
  string note = 5;
  string idempotency_key = 6;
}

message WalletMutationResponse {
  bool success = 1;
  string message = 2;
  Wallet wallet = 3;
  WalletTransaction transaction = 4;
}

message ListWalletTransactionsRequest {
  string user_id = 1;
  PaginationRequest pagination = 2;
  string reference_type = 3;
  string reference_id = 4;
}

message ListWalletTransactionsResponse {
  bool success = 1;
  repeated WalletTransaction transactions = 2;
  PaginationMeta meta = 3;
}

message RequestWithdrawalRequest {
  string user_id = 1;
  int64 amount_minor = 2;
  string bank_code = 3;
  string account_number = 4;
  string account_name = 5;
  string idempotency_key = 6;
}

message RequestWithdrawalResponse {
  bool success = 1;
  string message = 2;
  Withdrawal withdrawal = 3;
}

message ListWithdrawalsRequest {
  string user_id = 1;
  PaginationRequest pagination = 2;
  WithdrawalStatus status = 3;
}

message ListWithdrawalsResponse {
  bool success = 1;
  repeated Withdrawal withdrawals = 2;
  PaginationMeta meta = 3;
}

// =========================
// Escrow domain
// =========================

message Escrow {
  string escrow_id = 1;
  string deal_ref = 2; // your business/deal id
  string buyer_user_id = 3;
  string agent_user_id = 4;
  string property_id = 5;

  Currency currency = 6;
  int64 amount_minor = 7;
  int64 platform_fee_minor = 8;
  int64 net_to_agent_minor = 9;

  EscrowStatus status = 10;

  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp funded_at = 12;
  google.protobuf.Timestamp service_marked_complete_at = 13;
  google.protobuf.Timestamp released_at = 14;
  google.protobuf.Timestamp refunded_at = 15;
  google.protobuf.Timestamp cancelled_at = 16;
  google.protobuf.Timestamp updated_at = 17;

  string metadata_json = 18;
}

message EscrowEvent {
  string event_id = 1;
  string escrow_id = 2;
  EscrowEventType event_type = 3;
  ActorRole actor_role = 4;
  string actor_user_id = 5;
  string note = 6;
  string metadata_json = 7;
  google.protobuf.Timestamp created_at = 8;
}

message EscrowDispute {
  string dispute_id = 1;
  string escrow_id = 2;
  string opened_by_user_id = 3;
  string reason = 4;
  string details = 5;
  DisputeStatus status = 6;

  int64 buyer_award_minor = 7;
  int64 agent_award_minor = 8;
  string admin_note = 9;

  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp resolved_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message CreateEscrowRequest {
  string deal_ref = 1;
  string buyer_user_id = 2;
  string agent_user_id = 3;
  string property_id = 4;

  CurrencyCode currency_code = 5;
  int64 amount_minor = 6;
  int64 platform_fee_minor = 7;

  // if true, attempt immediate hold from buyer wallet
  bool hold_funds_now = 8;

  string metadata_json = 9;
  string idempotency_key = 10;
}

message EscrowResponse {
  bool success = 1;
  string message = 2;
  Escrow escrow = 3;
}

message GetEscrowByIdRequest {
  string escrow_id = 1;
}

message GetEscrowByDealRefRequest {
  string deal_ref = 1;
}

message ListEscrowsByUserRequest {
  string user_id = 1;
  ActorRole role = 2; // buyer or agent
  PaginationRequest pagination = 3;
  EscrowStatus status = 4; // optional filter; UNSPECIFIED = all
}

message ListEscrowsResponse {
  bool success = 1;
  repeated Escrow escrows = 2;
  PaginationMeta meta = 3;
}

message MarkEscrowServiceCompleteRequest {
  string escrow_id = 1;
  string agent_user_id = 2;
  string note = 3;
  string idempotency_key = 4;
}

message ReleaseEscrowRequest {
  string escrow_id = 1;
  string buyer_user_id = 2;
  string note = 3;
  string idempotency_key = 4;
}

message CancelEscrowRequest {
  string escrow_id = 1;
  string cancelled_by_user_id = 2;
  ActorRole cancelled_by_role = 3;
  string reason = 4;
  string idempotency_key = 5;
}

message OpenEscrowDisputeRequest {
  string escrow_id = 1;
  string opened_by_user_id = 2;
  ActorRole opened_by_role = 3;
  string reason = 4;
  string details = 5;
  string idempotency_key = 6;
}

message OpenEscrowDisputeResponse {
  bool success = 1;
  string message = 2;
  EscrowDispute dispute = 3;
  Escrow escrow = 4;
}

message ResolveEscrowDisputeRequest {
  string dispute_id = 1;
  string admin_user_id = 2;
  DisputeStatus resolution = 3; // buyer/agent/split/rejected
  int64 buyer_award_minor = 4;
  int64 agent_award_minor = 5;
  string admin_note = 6;
  string idempotency_key = 7;
}

message ResolveEscrowDisputeResponse {
  bool success = 1;
  string message = 2;
  EscrowDispute dispute = 3;
  Escrow escrow = 4;
}

message GetEscrowTimelineRequest {
  string escrow_id = 1;
}

message GetEscrowTimelineResponse {
  bool success = 1;
  repeated EscrowEvent events = 2;
}

// =========================
// Provider/payment intent domain
// =========================

message CreatePaymentIntentRequest {
  string buyer_user_id = 1;
  string escrow_id = 2;
  int64 amount_minor = 3;
  CurrencyCode currency_code = 4;
  string provider = 5; // e.g. "paystack"
  string email = 6;
  string callback_url = 7;
  string idempotency_key = 8;
  PaymentPurpose purpose = 9; // optional; defaults to escrow funding
}

message CreatePaymentIntentResponse {
  bool success = 1;
  string message = 2;
  string payment_id = 3;
  string provider_reference = 4;
  string payment_link = 5;
}

message VerifyPaymentByReferenceRequest {
  string provider = 1;
  string reference = 2;
}

message VerifyPaymentByReferenceResponse {
  bool success = 1;
  string message = 2;
  string payment_id = 3;
  string provider_reference = 4;
  string status = 5; // "pending" | "success" | "failed"
  string escrow_id = 6;
}

message HandleProviderWebhookRequest {
  string provider = 1;
  string signature = 2;
  string event = 3;
  string payload_json = 4;
}

message HandleProviderWebhookResponse {
  bool success = 1;
  string message = 2;
}

message CreateWalletTopupIntentRequest {
  string user_id = 1;
  int64 amount_minor = 2;
  CurrencyCode currency_code = 3;
  string provider = 4;
  string email = 5;
  string callback_url = 6;
  string idempotency_key = 7;
}

message CreateWalletTopupIntentResponse {
  bool success = 1;
  string message = 2;
  string payment_id = 3;
  string provider_reference = 4;
  string payment_link = 5;
}

message VerifyWalletTopupRequest {
  string provider = 1;
  string reference = 2;
}

message VerifyWalletTopupResponse {
  bool success = 1;
  string message = 2;
  string payment_id = 3;
  string provider_reference = 4;
  string status = 5;
  string user_id = 6;
}

// =========================
// Services
// =========================

service WalletService {
  rpc CreateWallet(CreateWalletRequest) returns (CreateWalletResponse);
  rpc GetWalletByUserId(GetWalletByUserIdRequest) returns (GetWalletResponse);
  rpc GetWalletById(GetWalletByIdRequest) returns (GetWalletResponse);

  rpc CreditWallet(CreditWalletRequest) returns (WalletMutationResponse);
  rpc DebitWallet(DebitWalletRequest) returns (WalletMutationResponse);

  rpc ListWalletTransactions(ListWalletTransactionsRequest) returns (ListWalletTransactionsResponse);

  rpc RequestWithdrawal(RequestWithdrawalRequest) returns (RequestWithdrawalResponse);
  rpc ListWithdrawals(ListWithdrawalsRequest) returns (ListWithdrawalsResponse);
}

service EscrowService {
  rpc CreateEscrow(CreateEscrowRequest) returns (EscrowResponse);
  rpc GetEscrowById(GetEscrowByIdRequest) returns (EscrowResponse);
  rpc GetEscrowByDealRef(GetEscrowByDealRefRequest) returns (EscrowResponse);
  rpc ListEscrowsByUser(ListEscrowsByUserRequest) returns (ListEscrowsResponse);

  rpc MarkEscrowServiceComplete(MarkEscrowServiceCompleteRequest) returns (EscrowResponse);
  rpc ReleaseEscrow(ReleaseEscrowRequest) returns (EscrowResponse);
  rpc CancelEscrow(CancelEscrowRequest) returns (EscrowResponse);

  rpc OpenEscrowDispute(OpenEscrowDisputeRequest) returns (OpenEscrowDisputeResponse);
  rpc ResolveEscrowDispute(ResolveEscrowDisputeRequest) returns (ResolveEscrowDisputeResponse);

  rpc GetEscrowTimeline(GetEscrowTimelineRequest) returns (GetEscrowTimelineResponse);
}

service PaymentService {
  rpc CreatePaymentIntent(CreatePaymentIntentRequest) returns (CreatePaymentIntentResponse);
  rpc VerifyPaymentByReference(VerifyPaymentByReferenceRequest) returns (VerifyPaymentByReferenceResponse);
  rpc HandleProviderWebhook(HandleProviderWebhookRequest) returns (HandleProviderWebhookResponse);
  rpc CreateWalletTopupIntent(CreateWalletTopupIntentRequest) returns (CreateWalletTopupIntentResponse);
  rpc VerifyWalletTopup(VerifyWalletTopupRequest) returns (VerifyWalletTopupResponse);
}